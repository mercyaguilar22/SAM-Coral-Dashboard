name: Daily SAM Coral Monitoring Update

on:
  schedule:
    # 06:00 UTC todos los días (00:00 hora estándar de Centroamérica / Guatemala CST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite ejecución manual desde la pestaña Actions en GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Ejecutar Pipeline Diario (NOAA ERDDAP + RF Inferencia + Alertas)
        run: |
          python -m src.pipeline.daily_pipeline

      - name: Guardar y Publicar Datos Actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          if git status --porcelain | grep -E "data/daily"; then
            git commit -m "chore(data): actualización diaria de alertas SAM [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "No hay cambios nuevos en los datos de hoy."
          fi
